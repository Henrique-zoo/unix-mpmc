name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: C formatting (clang-format 23)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Clang-Format 23
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl

          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.asc > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list

          sudo apt-get update
          sudo apt-get install -y clang-format-23

      - name: Show formatter version
        run: clang-format-23 --version

      - name: Check C formatting
        run: |
          find src include -type f \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format-23 --style=file --dry-run --Werror

  compilation:
    name: Build and test (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Clang 23
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl

          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/llvm-archive-keyring.asc > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list

          sudo apt-get update
          sudo apt-get install -y clang-23 coreutils procps

      - name: Show compiler version
        run: clang-23 --version

      - name: Build application (C23)
        run: make MODE=${{ matrix.mode }} CC=clang-23 all

      - name: Run unit and integration tests
        run: >-
          timeout --signal=TERM --kill-after=10s 120s
          make MODE=${{ matrix.mode }} CC=clang-23 test

  documentation:
    name: Generate Doxygen documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate HTML documentation
        run: |
          make docs
          test -f build/docs/html/index.html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/docs/html/
          if-no-files-found: error
